<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AVANI Live Report</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#22304a}.loading{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);box-sizing:border-box;background:#fff;border:1px solid #dfe7f2;border-radius:22px;padding:30px;box-shadow:0 22px 60px rgba(20,40,80,.10);text-align:center}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:#4772c9}.card h1{margin:8px 0 10px;font-size:24px;color:#172554}.card p{margin:0;color:#718096;font-size:13px;line-height:1.65}.spinner{width:28px;height:28px;margin:0 auto 18px;border:3px solid #dbe6f5;border-top-color:#315fce;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading" id="state"><div class="card"><div class="spinner"></div><div class="eyebrow">AVANI Media</div><h1>Loading live report</h1><p>Fetching the latest published client report.</p></div></div>
<script>
const LIVE_REPORT_API='https://qrkghrvlcjonkayxzhwg.supabase.co/functions/v1/live-report-api';
const REPORT_RUNTIME='https://qrkghrvlcjonkayxzhwg.supabase.co/functions/v1/avani-report-runtime';
function showError(message){document.getElementById('state').innerHTML='<div class="card"><div class="eyebrow">AVANI Media</div><h1>Report unavailable</h1><p>'+String(message||'The requested report could not be loaded.').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p></div>'}
(async()=>{try{const params=new URLSearchParams(location.search);const slug=(params.get('report')||params.get('client')||'').trim();if(!slug)throw new Error('No report was specified in this link.');const response=await fetch(LIVE_REPORT_API+'?slug='+encodeURIComponent(slug),{cache:'no-store'});const data=await response.json();if(!response.ok||!data.html_content)throw new Error(data.error||'This report has not been published yet.');const runtimeTag='<script src="'+REPORT_RUNTIME+'"><\/script>';const liveHtml=String(data.html_content).includes('</body>')?String(data.html_content).replace('</body>',runtimeTag+'</body>'):String(data.html_content)+runtimeTag;document.open();document.write(liveHtml);document.close()}catch(e){showError(e&&e.message?e.message:String(e))}})();
</script>
</body>
</html>
